<header *ngIf="layout === 'desktop'">
  <a
    [routerLink]="blogIndexLink"
    class="blog-link"
    [attr.aria-label]="t('blog.actions.open')">
    {{ t('blog.title') }}
  </a>
  <button
    type="button"
    class="blog-link language-trigger"
    (click)="toggleLanguagePanel()">
    <img src="/icons/idioma.png" alt="" aria-hidden="true" class="language-trigger-icon">
    <span>{{ currentLanguage | uppercase }}</span>
  </button>
  <button
    type="button"
    class="config-icon"
    [attr.aria-label]="t('tooltips.cursorConfig')"
    (click)="toggleConfigPanel()">
    <span class="config-icon-glyph" aria-hidden="true"></span>
  </button>
</header>

<app-config-panel 
  #configPanel
  *ngIf="showConfigPanel"
  [layout]="layout"
  (close)="showConfigPanel = false">
</app-config-panel>

<app-language-panel
  #languagePanel
  *ngIf="showLanguagePanel"
  (close)="showLanguagePanel = false">
</app-language-panel>

<villayoel-desktop *ngIf="layout === 'desktop'"></villayoel-desktop>
<villayoel-mobile
  *ngIf="layout === 'mobile'"
  (openLanguagePanel)="toggleLanguagePanel()"
  (openConfigPanel)="toggleConfigPanel()"></villayoel-mobile>
